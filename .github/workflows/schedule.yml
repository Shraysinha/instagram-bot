name: Multi-Bot Instagram Automation

on:
  schedule:
    - cron: '30 0 * * 1'
    - cron: '30 5 * * 1'
    ...
  workflow_dispatch:

jobs:
  multi-bot-run:
    runs-on: ubuntu-latest
    env:
      COMMENT_SOURCE_URL: ${{ secrets.COMMENT_SOURCE_URL }}
      BOT1_SESSION: ${{ secrets.BOT1_SESSION }}
      BOT2_SESSION: ${{ secrets.BOT2_SESSION }}
      # Add more bot session secrets here

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.10

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install instagrapi requests

    - name: Run Instagram bot
      run: python main.py
